# Allow boot.scr (legacy script image) with the source command
CONFIG_LEGACY_IMAGE_FORMAT=y

# setexpr is needed by boot.scr to count down BOOT_A_LEFT / BOOT_B_LEFT
CONFIG_CMD_SETEXPR=y

# Store the environment as uboot.env on the SD card's FAT partition
# CONFIG_ENV_IS_IN_EXT4 is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="mmc"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"

# Boot counter stored in the environment (uses upgrade_available)
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y
