# Start from poky's settings and change only what's different
require conf/distro/poky.conf

# ---- Identity ----
DISTRO = "cemos"
DISTRO_NAME = "Cem OS"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "first"
MAINTAINER = "Cem <mesutcemakin@gmail.com>"

# ---- Init system ----
INIT_MANAGER = "sysvinit"

# ---- System-wide features ----
DISTRO_FEATURES:append = " rauc"

# ---- How packages are built ----
# sysvinit has no systemd to start RAUC's D-Bus service; use the CLI directly
PACKAGECONFIG:remove:pn-rauc = "service"

# ---- Package format ----
PACKAGE_CLASSES = "package_rpm"

